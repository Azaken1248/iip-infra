services:
  kafka:
    restart: unless-stopped
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: iip-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092" # host access only; other containers use kafka:19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      # Kafka had no volume at all until now: its log dir was a path inside the
      # container, so every `docker compose down` silently destroyed every
      # topic. That is not a tidiness problem -- it takes two documented
      # capabilities with it. Replaying a contract's records from topic
      # retention (UC-9's backfill postcondition) is impossible if the
      # retention is gone, and the DLQ, whose entire purpose is that a bad
      # message is quarantined rather than lost, was being emptied by a command
      # people run to restart the stack.
      #
      # /var/lib/kafka/data rather than the old /tmp path: /tmp is not somewhere
      # durable data should live even when it happens to survive.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [iip]

  kafka-topics-init:
    image: apache/kafka:4.3.1
    container_name: iip-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic interns.created --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic iip.dlq --partitions 1 --replication-factor 1
      "
    networks: [iip]

  # Phase 4.6. The envelope stops being a Java record three services happen to
  # agree on and becomes a versioned artifact with an owner. Note what is NOT
  # here: no per-contract subjects. The envelope is one schema for the whole
  # platform (Data Model 1a); per-contract payload schemas live in the
  # Contract Registry, which is a different service for a different reason.
  schema-registry:
    restart: unless-stopped
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    container_name: iip-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Platform-wide default, so a subject created by accident still gets the
      # rule Data Model 5.1 asks for rather than Confluent's own default.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    ports:
      # 8085 on the host because the db-adapter already owns 8081 there;
      # inside the network it stays on Schema Registry's conventional 8081.
      - "${SCHEMA_REGISTRY_HOST_PORT:-8085}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [iip]

  # Phase 4.7. Registers infra/schemas/envelope.json as the subject every
  # service validates against. Same shape as kafka-topics-init and
  # contract-registry-init: the deployment's starting state is applied by a
  # job through the public API, never baked into an image.
  #
  # The work lives in a script rather than inline here because it needs both
  # JSON bodies and single-quoted jq programs, and nesting those inside a
  # folded YAML scalar inside a shell -c string is three quoting layers deep
  # -- a file has one. The same script is what CI runs in Phase 4.10.
  schema-registry-init:
    image: alpine:3.20
    container_name: iip-schema-registry-init
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./schemas:/schemas:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      apk add --no-cache curl jq >/dev/null &&
      sh /schemas/register-envelope.sh
      "
    networks: [iip]

  kafka-ui:
    restart: unless-stopped
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: iip-kafka-ui
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: iip
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [iip]

  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    container_name: iip-postgres
    environment:
      POSTGRES_DB: iip
      POSTGRES_USER: iip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iip}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432" # host-side only; containers use postgres:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The whole directory rather than one file: initdb runs *.sql in
      # lexical order, so the numeric prefixes are the ordering, and adding
      # a table no longer means editing this file.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iip -d iip"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [iip]

  contract-registry:
    restart: unless-stopped
    build:
      context: ../contract-registry
    container_name: iip-contract-registry
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/iip
      DB_USERNAME: ${POSTGRES_USER:-iip}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iip}
      SERVER_PORT: 8083
      # Phase 6.6: the control-plane UI is hosted separately (Vercel), so its
      # origin is not localhost and has to be listed here. Set
      # CONTROL_PLANE_ORIGIN in .env to the deployed UI's URL -- without it the
      # browser blocks every write with a CORS error that says nothing about
      # which origin was missing.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}${CONTROL_PLANE_ORIGIN:+,${CONTROL_PLANE_ORIGIN}}
    ports:
      - "${CONTRACT_REGISTRY_HOST_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [iip]

  # Seeds the registry with the platform's contracts, the same way
  # kafka-topics-init seeds its topics. These files are the contracts that
  # used to be baked into the source-service image (Phase 4.4); they live
  # here now because infra is where a deployment's starting state belongs,
  # and POSTing them is exactly what the control-plane UI will do in
  # Release 6 -- no privileged path, just the public API.
  contract-registry-init:
    image: curlimages/curl:latest
    container_name: iip-contract-registry-init
    depends_on:
      # service_started, not service_healthy: the registry image carries no
      # curl, so it has no healthcheck to wait on. That means "started" here
      # is compatible with the app having already died -- hence the bounded
      # poll below. An unbounded `until curl` turns a registry that crashed
      # on boot into a stack that hangs forever with no error, which is a
      # much worse failure than the one it is covering for.
      contract-registry:
        condition: service_started
    volumes:
      - ./contracts:/contracts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'waiting for the contract registry...' &&
      attempt=0;
      until curl -sf http://contract-registry:8083/actuator/health >/dev/null; do
      attempt=$$((attempt + 1));
      if [ $$attempt -ge 60 ]; then
      echo 'contract-registry never became reachable after 120s -- it is almost certainly dead, not slow: run docker logs iip-contract-registry' >&2;
      exit 1;
      fi;
      sleep 2;
      done &&
      for f in /contracts/*.json; do
      echo registering $$f;
      curl -sS --fail-with-body -X POST http://contract-registry:8083/contracts -H 'Content-Type: application/json' --data-binary @$$f || exit 1;
      echo;
      done &&
      echo 'contracts registered'
      "
    networks: [iip]

  # Phase 5.8. Attaches the contracts to this deployment's postgres adapter.
  #
  # A separate job from contract-registry-init above, and it has to be: an
  # attachment references a contract by foreign key, so the contracts must
  # already be registered -- hence service_completed_successfully rather than
  # running both at once.
  #
  # Applied with psql rather than through the API because there is no
  # attachment API yet; Phase 6.6 adds POST /contracts/{id}/adapters and this
  # job goes away with it. Not an initdb script either: those run only against
  # an empty data volume, and this has to work on a deployment that already
  # has data. The SQL is idempotent, so running it on every `up` is the point
  # rather than a compromise.
  attachment-init:
    image: postgres:17-alpine
    container_name: iip-attachment-init
    depends_on:
      postgres:
        condition: service_healthy
      contract-registry-init:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-iip}
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      psql -h postgres -U ${POSTGRES_USER:-iip} -d ${POSTGRES_DB:-iip}
      --set ON_ERROR_STOP=1 -f /seed/attachments.sql &&
      echo 'attachments applied'
      "
    networks: [iip]

  source-service:
    restart: unless-stopped
    build:
      context: ../source-service
    container_name: iip-source-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Phase 4.4: the image ships no contract files. Without these two the
      # service falls back to reading the classpath, finds nothing, and
      # refuses to start -- which is the intended failure, not a silent one.
      CONTRACTS_SOURCE: registry
      CONTRACT_REGISTRY_URL: http://contract-registry:8083
      CONTRACT_REFRESH_INTERVAL_MS: ${CONTRACT_REFRESH_INTERVAL_MS:-30000}
      # Phase 4.8: every envelope is validated against the registered schema
      # before it reaches the producer's batch, so a malformed one fails the
      # POST rather than landing on a topic for an adapter to choke on.
      ENVELOPE_SCHEMA_SOURCE: registry
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "${SOURCE_SERVICE_HOST_PORT:-8080}:8080"
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      # Not merely "the registry is up": the contracts have to be *in* it,
      # or this service starts, finds an empty registry, and exits.
      contract-registry-init:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully
    networks: [iip]

  db-adapter:
    # Paired with this service's deliberate fail-fast: it refuses to start
    # without the registry (Phase 5.2), which without a restart policy would
    # turn a few seconds of control-plane downtime during a restart into an
    # adapter that stays dead until a human notices. Refusing to run
    # misconfigured is right; staying down afterwards is not.
    restart: unless-stopped
    build:
      context: ../db-adapter
    container_name: iip-db-adapter
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: jdbc:postgresql://postgres:5432/iip
      DB_USERNAME: iip
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iip}
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Distinct var names per adapter (not a shared RETRY_* name) so each
      # is genuinely independently tunable via .env -- see Release 2 Phase
      # 2.5. The container-internal names match application.yml on both
      # adapters; only the host-side .env names differ.
      RETRY_MAX_ATTEMPTS: ${DB_ADAPTER_RETRY_MAX_ATTEMPTS:-3}
      RETRY_INITIAL_BACKOFF_MS: ${DB_ADAPTER_RETRY_INITIAL_BACKOFF_MS:-200}
      RETRY_MULTIPLIER: ${DB_ADAPTER_RETRY_MULTIPLIER:-2.0}
      # Phase 4.8: this image ships no envelope schema, so without these two
      # it falls back to the classpath, finds nothing, and refuses to start --
      # the intended failure rather than a silent one.
      ENVELOPE_SCHEMA_SOURCE: registry
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Phase 5.2: which contracts this adapter writes for is registry data,
      # not deployment config. Only *where to ask* is configured here -- and it
      # is required, because the adapter refuses to start rather than come up
      # attached to nothing and silently discard every record.
      CONTRACT_REGISTRY_URL: http://contract-registry:8083
      ATTACHMENT_REFRESH_INTERVAL_MS: ${ATTACHMENT_REFRESH_INTERVAL_MS:-30000}
    ports:
      - "${DB_ADAPTER_HOST_PORT:-8081}:8081"
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
      # Phase 5.8: the attachments must exist before this starts, or its first
      # act is to log that it is attached to nothing. It would recover on the
      # next refresh, but a stack that comes up already working beats one that
      # comes up wrong and fixes itself 30 seconds later.
      attachment-init:
        condition: service_completed_successfully
    networks: [iip]

  file-adapter:
    restart: unless-stopped
    build:
      context: ../file-adapter
    container_name: iip-file-adapter
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVER_PORT: 8082
      FILE_OUTPUT_PATH: /data/interns.csv
      # Phase 6.3: which contracts this adapter writes for, and the columns and
      # file each one gets, are registry data now rather than deployment config.
      CONTRACT_REGISTRY_URL: http://contract-registry:8083
      ATTACHMENT_REFRESH_INTERVAL_MS: ${ATTACHMENT_REFRESH_INTERVAL_MS:-30000}
      DEDUP_STORE_PATH: /data/file-adapter-dedup
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      RETRY_MAX_ATTEMPTS: ${FILE_ADAPTER_RETRY_MAX_ATTEMPTS:-3}
      RETRY_INITIAL_BACKOFF_MS: ${FILE_ADAPTER_RETRY_INITIAL_BACKOFF_MS:-200}
      RETRY_MULTIPLIER: ${FILE_ADAPTER_RETRY_MULTIPLIER:-2.0}
      ENVELOPE_SCHEMA_SOURCE: registry
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "${FILE_ADAPTER_HOST_PORT:-8082}:8082"
    volumes:
      - file-adapter-data:/data
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully
      # Phase 6.3: this adapter reads its columns and output file from the
      # registry now, and refuses to start without them -- same as db-adapter.
      attachment-init:
        condition: service_completed_successfully
    networks: [iip]

  ui:
    restart: unless-stopped
    build:
      context: ../ui
    container_name: iip-ui
    ports:
      - "${UI_HOST_PORT:-3000}:80"
    depends_on:
      - source-service
    networks: [iip]

networks:
  iip:

volumes:
  kafka-data:
  postgres-data:
  file-adapter-data:
